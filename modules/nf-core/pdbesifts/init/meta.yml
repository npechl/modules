name: "pdbesifts_init"
description: Initialise PDBe-SIFTS configuration and cache state before database building or sequence search
keywords:
  - sifts
  - pdbe
  - pdb
  - taxonomy
  - config
  - init
tools:
  - "pdbe_sifts":
      description: "Python package to run the SIFTS (Structure Integration with Function, Taxonomy and Sequences) pipeline locally."
      homepage: "https://github.com/PDBeurope/SIFTS"
      documentation: "https://github.com/PDBeurope/SIFTS/blob/master/docs/cli.md"
      tool_dev_url: "https://github.com/PDBeurope/SIFTS"
      doi: "no DOI available"
      licence:
        - "Apache-2.0"
      identifier: ""

input:
  - meta:
      type: map
      description: |
        Groovy Map containing information for the config/cache to initialise
        e.g. `[ id:'sifts' ]`

output:
  sifts_config:
    - - meta:
          type: map
          description: |
            Groovy Map containing information for the config/cache to initialise
            e.g. `[ id:'sifts' ]`
      - ${prefix}:
          type: directory
          description: |
            HOME directory for this PDBe-SIFTS run, containing config.yaml, the UniProt-PDB
            cross-reference cache (uniprot_pdb.tsv.gz, uniprot_pdb.duckdb) under
            ${prefix}/.config/pdbe_sifts/, and the NCBI taxonomy cache used by later steps.
            Downstream pdbe_sifts steps must set HOME to (a staged copy of) this directory
            to pick up the generated config and caches.
          pattern: "${prefix}"
  versions_pdbesifts:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pdbe_sifts:
          type: string
          description: The name of the tool
      - "python -m pip show pdbe_sifts | sed -n 's/^Version: //p'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pdbe_sifts:
          type: string
          description: The name of the tool
      - "python -m pip show pdbe_sifts | sed -n 's/^Version: //p'":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@npechl"
maintainers:
